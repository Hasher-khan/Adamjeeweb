<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Admissions - Adamjee CMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../tailwind-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="mobile-menu.css">
    <script defer src="mobile-menu.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body class="font-['Inter'] antialiased min-h-screen flex text-surface-bright">

    <!-- Sidebar (Same as index.html) -->
    <aside class="w-64 glass-panel border-r border-white/10 flex flex-col hidden md:flex h-screen sticky top-0">
        <div class="p-6 border-b border-white/10 flex items-center gap-3">
            <div class="w-8 h-8 rounded bg-secondary flex items-center justify-center font-bold text-white shadow-lg">A</div>
            <h1 class="text-xl font-bold tracking-tight text-white">Adamjee CMS</h1>
        </div>
        
        <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
            <p class="text-xs font-semibold text-white/40 uppercase tracking-wider mb-2 px-3 mt-4">Menu</p>
            <a href="index.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-white/70 hover:bg-white/5 hover:text-white font-medium transition-colors">
                <i class="ri-dashboard-line text-lg"></i> Dashboard
            </a>
            <a href="admissions.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-white/10 text-white font-medium transition-colors">
                <i class="ri-article-line text-lg"></i> Admissions
            </a>
            <a href="faculty.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-white/70 hover:bg-white/5 hover:text-white font-medium transition-colors">
                <i class="ri-team-line text-lg"></i> Faculty
            </a>
            <a href="timetable.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-white/70 hover:bg-white/5 hover:text-white font-medium transition-colors">
                <i class="ri-calendar-todo-line text-lg"></i> Timetable
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col min-h-screen overflow-hidden relative z-10">
        
        <!-- Header -->
        <header class="glass-panel border-b border-white/10 px-8 py-5 flex items-center justify-between sticky top-0 z-20">
            <div class="flex items-center gap-4">
                <h2 class="text-2xl font-semibold text-white">Manage Admissions</h2>
            </div>
            <div class="flex items-center gap-3">
                <button class="px-4 py-2 rounded-lg bg-white/10 hover:bg-white/20 text-white font-medium text-sm transition">
                    Cancel
                </button>
                <button id="save-btn" class="px-4 py-2 rounded-lg bg-secondary hover:bg-secondary/90 text-white font-medium text-sm transition shadow-lg shadow-secondary/20 flex items-center gap-2">
                    <i class="ri-save-3-line"></i> Save Changes
                </button>
            </div>
        </header>

        <!-- Editor Content -->
        <div class="flex-1 p-8 overflow-y-auto">
            
            <div class="max-w-4xl mx-auto space-y-8">
                
                <!-- Status Banner -->
                <div class="glass-panel rounded-xl p-4 border-l-4 border-l-green-500 fade-in" style="animation-delay: 0.1s;">
                    <div class="flex gap-3 items-center">
                        <i class="ri-checkbox-circle-fill text-green-500 text-xl"></i>
                        <div>
                            <h4 class="font-medium text-white">Status: Open</h4>
                            <p class="text-sm text-white/60">Admissions are currently active on the main website.</p>
                        </div>
                    </div>
                </div>

                <!-- Form -->
                <div class="glass-panel rounded-2xl p-8 fade-in" style="animation-delay: 0.2s;">
                    <h3 class="text-lg font-semibold text-white mb-6 border-b border-white/10 pb-4">General Information</h3>
                    
                    <form class="space-y-6">
                        <div>
                            <label class="block text-sm font-medium text-white/70 mb-2">Page Title</label>
                            <input id="inp-title" type="text" value="Admissions 2026-2027" class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition">
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-sm font-medium text-white/70 mb-2">Deadline Date</label>
                                <input id="inp-deadline" type="date" value="2026-09-30" class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-white/70 mb-2">Application Fee (PKR)</label>
                                <input id="inp-fee" type="number" value="1500" class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition">
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-white/70 mb-2">Main Content / Instructions</label>
                            <!-- Mock Rich Text Editor -->
                            <div class="border border-white/10 rounded-lg overflow-hidden">
                                <div class="bg-white/5 border-b border-white/10 px-4 py-2 flex gap-2">
                                    <button type="button" class="p-1.5 rounded hover:bg-white/10 text-white/70"><i class="ri-bold"></i></button>
                                    <button type="button" class="p-1.5 rounded hover:bg-white/10 text-white/70"><i class="ri-italic"></i></button>
                                    <button type="button" class="p-1.5 rounded hover:bg-white/10 text-white/70"><i class="ri-list-unordered"></i></button>
                                </div>
                                <textarea id="inp-instructions" rows="6" class="w-full bg-transparent border-0 px-4 py-3 text-white focus:outline-none resize-y">Welcome to the Adamjee admissions portal. Please ensure all documents are attested before submission.</textarea>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-white/70 mb-2">Required Documents</label>
                            <div class="space-y-3">
                                <div class="flex items-center gap-3 bg-white/5 border border-white/10 p-3 rounded-lg">
                                    <i class="ri-draggable text-white/30 cursor-move"></i>
                                    <input type="text" value="Previous Academic Transcripts" class="flex-1 bg-transparent border-0 text-sm text-white focus:outline-none">
                                    <button type="button" class="text-red-400 hover:text-red-300"><i class="ri-delete-bin-line"></i></button>
                                </div>
                                <div class="flex items-center gap-3 bg-white/5 border border-white/10 p-3 rounded-lg">
                                    <i class="ri-draggable text-white/30 cursor-move"></i>
                                    <input type="text" value="Copy of CNIC / B-Form" class="flex-1 bg-transparent border-0 text-sm text-white focus:outline-none">
                                    <button type="button" class="text-red-400 hover:text-red-300"><i class="ri-delete-bin-line"></i></button>
                                </div>
                                <button type="button" class="text-secondary-fixed-dim text-sm font-medium hover:text-white flex items-center gap-1 mt-2">
                                    <i class="ri-add-line"></i> Add Requirement
                                </button>
                            </div>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Load existing data
            const data = await fetchAdmissionsData();
            if (data) {
                document.getElementById('inp-title').value = data.title || '';
                document.getElementById('inp-deadline').value = data.deadline || '';
                document.getElementById('inp-fee').value = data.fee || '';
                document.getElementById('inp-instructions').value = data.instructions || '';
            }

            // Save data
            document.getElementById('save-btn').addEventListener('click', async () => {
                const saveBtn = document.getElementById('save-btn');
                const originalText = saveBtn.innerHTML;
                saveBtn.innerHTML = '<i class="ri-loader-4-line animate-spin"></i> Saving...';

                const newData = {
                    title: document.getElementById('inp-title').value,
                    deadline: document.getElementById('inp-deadline').value,
                    fee: document.getElementById('inp-fee').value,
                    instructions: document.getElementById('inp-instructions').value,
                    documents: ["Previous Academic Transcripts", "Copy of CNIC / B-Form"] // Mocked for now
                };

                const res = await saveAdmissionsData(newData);
                if (res && res.success) {
                    saveBtn.innerHTML = '<i class="ri-check-line"></i> Saved!';
                    setTimeout(() => saveBtn.innerHTML = originalText, 2000);
                } else {
                    saveBtn.innerHTML = '<i class="ri-error-warning-line"></i> Error';
                    setTimeout(() => saveBtn.innerHTML = originalText, 2000);
                }
            });
        });
    </script>
</body>
</html>
