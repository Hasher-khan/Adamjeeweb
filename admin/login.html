<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adamjee CMS - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../tailwind-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 50% 50%, #00122e 0%, #000814 100%);
        }
        .glass-login {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Login Container -->
    <div id="login-card" class="w-full max-w-md glass-login rounded-2xl p-8 relative overflow-hidden transition-all duration-300">
        <!-- Brand/Logo Header -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 rounded-2xl bg-secondary flex items-center justify-center font-bold text-3xl text-white shadow-lg shadow-secondary/20 mx-auto mb-4">
                A
            </div>
            <h2 class="text-2xl font-bold tracking-tight text-white">Adamjee CMS Portal</h2>
            <p class="text-sm text-white/50 mt-1">Authorized access only. Please verify your credentials.</p>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="space-y-5" onsubmit="handleLogin(event)">
            <div>
                <label for="password" class="block text-xs font-semibold text-white/60 uppercase tracking-wider mb-2">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-white/40">
                        <i class="ri-lock-line"></i>
                    </span>
                    <input type="password" id="password" required
                        class="w-full bg-white/5 border border-white/10 rounded-xl py-3 pl-10 pr-4 text-white placeholder-white/20 focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-all"
                        placeholder="••••••••••••">
                </div>
            </div>

            <div>
                <label for="verification" class="block text-xs font-semibold text-white/60 uppercase tracking-wider mb-2">Verification Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-white/40">
                        <i class="ri-shield-keyhole-line"></i>
                    </span>
                    <input type="password" id="verification" required
                        class="w-full bg-white/5 border border-white/10 rounded-xl py-3 pl-10 pr-4 text-white placeholder-white/20 focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-all"
                        placeholder="••••••••••••">
                </div>
            </div>

            <!-- Error Banner -->
            <div id="error-message" class="hidden items-center gap-2 p-3 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 text-sm font-medium transition-all">
                <i class="ri-error-warning-line text-lg"></i>
                <span>Incorrect credentials! Please try again.</span>
            </div>

            <button type="submit" 
                class="w-full py-3.5 px-4 rounded-xl bg-secondary hover:bg-secondary/90 active:scale-[0.98] text-white font-semibold text-sm transition-all shadow-lg shadow-secondary/20 flex items-center justify-center gap-2">
                <i class="ri-login-box-line"></i> Verify & Authenticate
            </button>
        </form>

        <!-- Back to Main Site -->
        <div class="mt-6 text-center">
            <a href="../index.html" class="text-xs text-white/40 hover:text-white transition flex items-center justify-center gap-1.5">
                <i class="ri-arrow-left-line"></i> Back to Adamjee Website
            </a>
        </div>
    </div>

    <script>
        // Redirect to dashboard if already authenticated
        if (sessionStorage.getItem('admin_authenticated') === 'true') {
            window.location.href = 'index.html';
        }

        function handleLogin(event) {
            event.preventDefault();
            
            const passwordInput = document.getElementById('password').value;
            const verificationInput = document.getElementById('verification').value;
            
            // Admin access credentials. Both fields must be entered correctly.
            const ADMIN_CREDENTIALS = Object.freeze({
                password: 'hk786412345',
                verification: 'adamjee12345'
            });
            
            const errorMsg = document.getElementById('error-message');
            const card = document.getElementById('login-card');

            if (passwordInput === ADMIN_CREDENTIALS.password && verificationInput === ADMIN_CREDENTIALS.verification) {
                // Success path
                errorMsg.classList.add('hidden');
                sessionStorage.setItem('admin_authenticated', 'true');
                
                // Success feedback and redirect
                const btn = event.target.querySelector('button');
                btn.innerHTML = '<i class="ri-loader-4-line animate-spin"></i> Authenticating...';
                btn.disabled = true;
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 800);
            } else {
                // Failure path
                errorMsg.classList.remove('hidden');
                errorMsg.classList.add('flex');
                
                // Shake animation trigger
                card.classList.remove('animate-shake');
                void card.offsetWidth; // Trigger reflow to restart animation
                card.classList.add('animate-shake');
            }
        }
    </script>
</body>
</html>
